<!DOCTYPE html>
<html lang="en">
<head>

<title>ReconArena Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #f3f6f6;
    --panel: #ffffff;
    --panel-2: #eaf0f0;
    --border: #d7e0e1;
    --text: #101a1c;
    --muted: #59696d;
    --accent: #0f8f83;
    --accent-ink: #ffffff;
    --good: #1a8a4a;
    --good-bg: #e5f5ea;
    --warn: #9a6a06;
    --warn-bg: #fbf0da;
    --bad: #b0403a;
    --bad-bg: #fbe8e6;
    --gold: #a3760a;
    --gold-bg: #faf1dc;
    --shadow: 0 1px 2px rgba(16,26,28,0.04), 0 8px 24px -12px rgba(16,26,28,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d1417; --panel: #141d21; --panel-2: #1a252a; --border: #263237;
      --text: #e8eef0; --muted: #8fa0a5; --accent: #2bc4b6; --accent-ink: #06201d;
      --good: #4bd587; --good-bg: #123322; --warn: #f0b23e; --warn-bg: #3a2c0e;
      --bad: #ff8078; --bad-bg: #3a1917; --gold: #f0c14b; --gold-bg: #332708;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d1417; --panel: #141d21; --panel-2: #1a252a; --border: #263237;
    --text: #e8eef0; --muted: #8fa0a5; --accent: #2bc4b6; --accent-ink: #06201d;
    --good: #4bd587; --good-bg: #123322; --warn: #f0b23e; --warn-bg: #3a2c0e;
    --bad: #ff8078; --bad-bg: #3a1917; --gold: #f0c14b; --gold-bg: #332708;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--text);
    font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
    margin: 0; -webkit-font-smoothing: antialiased;
  }
  code, .mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 14px 22px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 8px; }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .brand h1 { font-size: 1.05rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .brand .tag { color: var(--muted); font-size: 0.78rem; font-weight: 500; }

  .view-switch { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; }
  .view-btn {
    border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 0.82rem;
    padding: 7px 14px; border-radius: 7px; cursor: pointer;
  }
  .view-btn.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  .tiers { display: flex; gap: 6px; background: var(--panel-2); padding: 4px; border-radius: 10px; margin-left: auto; }
  .tier-btn {
    border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 0.82rem;
    padding: 7px 14px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 7px;
    transition: background 0.15s, color 0.15s;
  }
  .tier-btn:hover { color: var(--text); }
  .tier-btn.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .tier-btn .chip {
    font-family: "IBM Plex Mono"; font-size: 0.68rem; font-weight: 600;
    padding: 1px 6px; border-radius: 999px; background: var(--good-bg); color: var(--good);
  }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 0; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .sidebar {
    border-right: 1px solid var(--border); padding: 20px 18px;
    position: sticky; top: 61px; height: calc(100vh - 61px); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  @media (max-width: 880px) { .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); } }

  .side-group { margin-bottom: 22px; }
  .side-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 10px; display: block;
  }
  .search-box {
    width: 100%; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 10px 8px 30px; font-family: "IBM Plex Mono"; font-size: 0.82rem;
  }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }
  .search-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  select.filter-select {
    width: 100%; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }

  .agent-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .agent-toggle button {
    flex: 1; border: none; background: var(--panel); color: var(--muted); font-weight: 700; font-size: 0.78rem;
    padding: 8px 6px; cursor: pointer;
  }
  .agent-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .agent-toggle button:not(:last-child) { border-right: 1px solid var(--border); }

  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-weight: 600; font-size: 0.74rem;
    padding: 5px 10px; border-radius: 999px; cursor: pointer; transition: all 0.12s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none; }
  .switch { width: 34px; height: 20px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); position: relative; flex-shrink: 0; transition: background 0.15s; }
  .switch::after { content: ""; position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(14px); background: var(--accent-ink); }

  .reset-link { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 0.78rem; cursor: pointer; padding: 0; }

  .live-run-btn {
    margin-top: auto; width: 100%; border: 1px solid var(--accent); background: var(--panel); color: var(--accent);
    font-weight: 800; font-size: 0.82rem; padding: 10px 12px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px; transition: background 0.12s, color 0.12s;
  }
  .live-run-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .live-run-btn svg { flex-shrink: 0; }
  .live-status { font-size: 0.72rem; color: var(--muted); margin-top: 8px; line-height: 1.5; text-align: center; }
  .live-status.ok { color: var(--good); }

  /* ---------- Main ---------- */
  .main { padding: 22px 24px 60px; min-width: 0; }

  .scorecards { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
  .card .value { font-family: "IBM Plex Mono"; font-size: 1.5rem; font-weight: 600; line-height: 1; }
  .card .bar-track { height: 4px; border-radius: 2px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .card .bar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .card.good .value { color: var(--good); } .card.good .bar-fill { background: var(--good); }
  .card.warn .value { color: var(--warn); } .card.warn .bar-fill { background: var(--warn); }
  .card.bad .value { color: var(--bad); } .card.bad .bar-fill { background: var(--bad); }
  .card.money .value { font-size: 1.25rem; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
  .section-head h2 { font-size: 1rem; font-weight: 800; margin: 0; }
  .result-count { color: var(--muted); font-size: 0.8rem; font-weight: 500; }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; background: var(--panel); box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }
  .tx-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; table-layout: fixed; }
  .tx-table col.c-pid { width: 24%; }
  .tx-table col.c-amount { width: 14%; }
  .tx-table col.c-method { width: 12%; }
  .tx-table col.c-verdict { width: 18%; }
  .tx-table col.c-issue { width: 22%; }
  .tx-table col.c-correct { width: 10%; }
  .tx-table th { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-table td { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
  .tx-table td.nowrap-cell { white-space: nowrap; }
  .tx-table th {
    text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700;
    padding: 10px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border);
  }
  .tx-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tx-row { cursor: pointer; transition: background 0.1s; }
  .tx-row:hover { background: var(--panel-2); }
  .tx-row:last-child td { border-bottom: none; }
  .tx-row.expanded { background: var(--panel-2); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: "IBM Plex Mono"; font-size: 0.7rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .correctness { font-size: 1rem; }
  .correctness.right { color: var(--good); }
  .correctness.wrong { color: var(--bad); }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
  .empty-state .big { font-size: 2rem; margin-bottom: 8px; }

  .detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .detail-panel { padding: 18px 20px 22px; background: var(--paper); }
  .trail { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 720px) { .trail { grid-template-columns: 1fr; } }
  .trail-node { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .trail-node h4 { margin: 0 0 8px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; padding: 3px 0; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: "IBM Plex Mono"; text-align: right; word-break: break-all; }
  .trail-arrow { display: flex; align-items: center; justify-content: center; color: var(--border); }

  .verdict-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .verdict-compare { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .topbar { padding: 10px 14px; gap: 10px; }
    .main { padding: 16px 14px 40px; }
    .tx-table { font-size: 0.76rem; }
    .tx-table th, .tx-table td { padding: 8px 8px; }
    .tx-table col.c-pid { width: 30%; }
    .tx-table col.c-amount { width: 16%; }
    .tx-table col.c-method { width: 0; display: none; }
    .lb-rank-card, .impact-card { padding: 14px 16px; }
  }
  .verdict-box { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
  .verdict-box h4 { margin: 0 0 8px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .verdict-box p { margin: 0; font-size: 0.85rem; line-height: 1.5; }
  .verdict-box.gt { border-left: 3px solid var(--accent); }
  .verdict-box.agent.right { border-left: 3px solid var(--good); }
  .verdict-box.agent.wrong { border-left: 3px solid var(--bad); }

  /* ---------- Leaderboard view ---------- */
  .lb-hero {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px;
    margin-bottom: 20px; box-shadow: var(--shadow); display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
  }
  .lb-hero-stat { flex: 1; min-width: 160px; }
  .lb-hero-stat .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .lb-hero-stat .value { font-family: "IBM Plex Mono"; font-size: 1.7rem; font-weight: 600; }
  .lb-hero-stat .sub { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }

  .lb-rank-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
  .lb-rank-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); }
  .lb-rank-card.first { border-color: var(--gold); }
  .lb-rank-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .lb-medal {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 700; font-size: 0.95rem; flex-shrink: 0;
    background: var(--panel-2); color: var(--muted);
  }
  .lb-rank-card.first .lb-medal { background: var(--gold-bg); color: var(--gold); }
  .lb-name { font-weight: 800; font-size: 1rem; }
  .lb-desc { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .lb-score { margin-left: auto; text-align: right; }
  .lb-score .num { font-family: "IBM Plex Mono"; font-size: 1.6rem; font-weight: 700; }
  .lb-score .lab { font-size: 0.68rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
  .lb-bar-track { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; margin-bottom: 14px; }
  .lb-bar-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .lb-rank-card.first .lb-bar-fill { background: var(--gold); }
  .lb-tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .lb-tier-cell { background: var(--panel-2); border-radius: 9px; padding: 10px 12px; }
  .lb-tier-cell .t-label { font-size: 0.68rem; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .lb-tier-cell .t-value { font-family: "IBM Plex Mono"; font-size: 1rem; font-weight: 600; }

  .impact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .impact-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  .impact-card h3 { margin: 0 0 12px; font-size: 0.9rem; font-weight: 800; }
  .impact-stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 10px; background: var(--panel-2); }
  .impact-stack .caught { background: var(--good); }
  .impact-stack .missed { background: var(--bad); }
  .impact-legend { display: flex; justify-content: space-between; font-size: 0.76rem; }
  .impact-legend .caught-lab { color: var(--good); font-weight: 700; }
  .impact-legend .missed-lab { color: var(--bad); font-weight: 700; }

  footer.page-footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 26px 0 8px; }
</style>

recision":null,"recall":0.0,"f1":null,"false_positive_rate":0.0,"attribution_accuracy":null}},"hard":{"tier":"hard","n_records":60,"n_unscored_missing_from_agent_output":0,"matching":{"tp":49,"fp":0,"fn":9,"tn":2,"precision":1.0,"recall":0.8448275862068966,"f1":0.9158878504672897},"issue_detection":{"n_real_issues":35,"tp":0,"fp":0,"fn":35,"precision":null,"recall":0.0,"f1":null,"false_positive_rate":0.0,"attribution_accuracy":null}}},"rank":2}]},"impact":{"smart":{"per_tier":{"easy":{"n_at_risk":18,"at_risk_inr":384454.66,"caught_inr":384454.66,"missed_inr":0.0,"caught_pct":1.0},"medium":{"n_at_risk":21,"at_risk_inr":460963.89,"caught_inr":433279.59,"missed_inr":27684.3,"caught_pct":0.9399},"hard":{"n_at_risk":35,"at_risk_inr":852953.76,"caught_inr":852953.76,"missed_inr":0.0,"caught_pct":1.0}},"overall":{"at_risk_inr":1698372.31,"caught_inr":1670688.01,"missed_inr":27684.3,"caught_pct":0.9837}},"naive":{"per_tier":{"easy":{"n_at_risk":18,"at_risk_inr":384454.66,"caught_inr":0.0,"missed_inr":384454.66,"caught_pct":0.0},"medium":{"n_at_risk":21,"at_risk_inr":460963.89,"caught_inr":0.0,"missed_inr":460963.89,"caught_pct":0.0},"hard":{"n_at_risk":35,"at_risk_inr":852953.76,"caught_inr":0.0,"missed_inr":852953.76,"caught_pct":0.0}},"overall":{"at_risk_inr":1698372.31,"caught_inr":0.0,"missed_inr":1698372.31,"caught_pct":0.0}}}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("bundle-data").textContent);
  var TIERS = ["easy", "medium", "hard"];

  var state = {
    view: "explorer",           // explorer | leaderboard
    tier: "easy",
    agent: "agent_output_smart", // agent_output_smart | agent_output_naive
    search: "",
    verdictFilter: "all",
    issueChips: new Set(),
    mismatchesOnly: false,
    expanded: null,
    liveStatus: null,           // {ok, text} after Live Run
  };

  var ISSUE_LABELS = {
    clean: "Clean", utr_mismatch: "UTR mismatch", tds_miscalc: "TDS miscalc",
    gst_mdr_miscalc: "GST-on-MDR miscalc", missing_settlement: "Missing settlement",
    amount_mismatch: "Amount mismatch", commission_miscalc: "Commission miscalc",
  };
  var VERDICT_LABELS = { matched_clean: "Matched · clean", matched_flagged: "Matched · flagged", unmatched: "Unmatched" };
  var AGENT_LABELS = { agent_output_smart: "Smart agent", agent_output_naive: "Naive agent" };

  // ---------------- Data indexing ----------------

  function buildTierIndex(raw) {
    var gtByPid = {}, settlementByPid = {}, bankByRef = {};
    var agentByPid = { agent_output_smart: {}, agent_output_naive: {} };
    raw.ground_truth.forEach(function (g) { gtByPid[g.payment_id] = g; });
    raw.agent_output_smart.forEach(function (a) { agentByPid.agent_output_smart[a.payment_id] = a; });
    raw.agent_output_naive.forEach(function (a) { agentByPid.agent_output_naive[a.payment_id] = a; });
    raw.settlements.forEach(function (s) { settlementByPid[s.internal_txn_id] = s; });
    raw.bank_statement.forEach(function (b) { bankByRef[b.bank_ref] = b; });
    return {
      raw: raw, gtByPid: gtByPid, agentByPid: agentByPid,
      settlementByPid: settlementByPid, bankByRef: bankByRef,
      vendorRates: raw.vendor_rates || {},
    };
  }

  var TIER_DATA = {};
  TIERS.forEach(function (t) { TIER_DATA[t] = buildTierIndex(DATA[t]); });

  function isCorrect(gt, agent) {
    var agentMatched = agent.verdict === "matched_clean" || agent.verdict === "matched_flagged";
    var matchCorrect = agentMatched === gt.expected_match;
    var issueCorrect;
    if (gt.issue_type === "clean" || !gt.expected_match) {
      issueCorrect = matchCorrect && (agent.verdict !== "matched_flagged");
    } else {
      var isOverlap = (gt.notes || "").indexOf("overlap") !== -1;
      issueCorrect = agent.verdict === "matched_flagged" &&
        (agent.issue_type === gt.issue_type || (isOverlap && agent.issue_type === "multiple"));
    }
    return matchCorrect && issueCorrect;
  }

  function computeRows(tier, agentKey) {
    return tier.raw.transactions.map(function (txn) {
      var gt = tier.gtByPid[txn.payment_id];
      var agent = tier.agentByPid[agentKey][txn.payment_id];
      var settlement = tier.settlementByPid[txn.payment_id] || null;
      var bank = agent && agent.bank_ref ? tier.bankByRef[agent.bank_ref] : null;
      return { txn: txn, gt: gt, agent: agent, settlement: settlement, bank: bank, correct: isCorrect(gt, agent) };
    });
  }

  function tierStats(tier, agentKey) {
    var rows = computeRows(tier, agentKey);
    var n = rows.length;
    var matchTP = 0, matchFP = 0, matchFN = 0;
    var issTP = 0, issFP = 0, issFN = 0, issCorrectAttr = 0, nRealIssues = 0, nCleanOrUnmatched = 0;
    rows.forEach(function (r) {
      var agentMatched = r.agent.verdict !== "unmatched";
      if (r.gt.expected_match && agentMatched) matchTP++;
      else if (!r.gt.expected_match && agentMatched) matchFP++;
      else if (r.gt.expected_match && !agentMatched) matchFN++;

      var hasRealIssue = r.gt.issue_type !== "clean" && r.gt.expected_match;
      var flagged = r.agent.verdict === "matched_flagged";
      if (hasRealIssue) {
        nRealIssues++;
        if (flagged) {
          issTP++;
          var isOverlap = (r.gt.notes || "").indexOf("overlap") !== -1;
          if (r.agent.issue_type === r.gt.issue_type || (isOverlap && r.agent.issue_type === "multiple")) issCorrectAttr++;
        } else issFN++;
      } else {
        nCleanOrUnmatched++;
        if (flagged) issFP++;
      }
    });
    var matchPrec = matchTP + matchFP ? matchTP / (matchTP + matchFP) : null;
    var matchRec = matchTP + matchFN ? matchTP / (matchTP + matchFN) : null;
    var matchF1 = matchPrec && matchRec ? 2 * matchPrec * matchRec / (matchPrec + matchRec) : null;
    var issPrec = issTP + issFP ? issTP / (issTP + issFP) : null;
    var issRec = issTP + issFN ? issTP / (issTP + issFN) : null;
    var fpr = nCleanOrUnmatched ? issFP / nCleanOrUnmatched : null;
    var attrAcc = issTP ? issCorrectAttr / issTP : null;
    var overallCorrect = rows.filter(function (r) { return r.correct; }).length;
    return {
      n: n, nRealIssues: nRealIssues, matchF1: matchF1, issPrec: issPrec, issRec: issRec,
      fpr: fpr, attrAcc: attrAcc, overallAccuracy: n ? overallCorrect / n : null,
    };
  }

  function pct(x) { return x === null || x === undefined ? "—" : Math.round(x * 100) + "%"; }
  function passingLabel(tier, agentKey) { return pct(tierStats(tier, agentKey).overallAccuracy); }
  function fmtINR(n) {
    if (n === null || n === undefined) return "—";
    return "₹" + Math.round(n).toLocaleString("en-IN");
  }
  function fmtINR2(n) {
    if (n === null || n === undefined) return "—";
    return "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function verdictPillClass(v) { if (v === "matched_clean") return "good"; if (v === "matched_flagged") return "warn"; return "bad"; }

  // ---------------- Live in-browser recompute (mirrors baseline_agent/agent.py) ----------------

  var ROUNDING_TOLERANCE = 0.05, AMOUNT_MATCH_TOLERANCE = 1.00, DATE_MATCH_WINDOW_DAYS = 5;
  var GST_ON_MDR_RATE = 0.18, TDS_RATE_194O = 0.001;

  function daysBetween(d1, d2) { return Math.round((new Date(d1) - new Date(d2)) / 86400000); }

  function liveReconcile(txn, settlements, bankEntries, vendorRates) {
    var settlement = settlements.find(function (s) { return s.internal_txn_id === txn.payment_id; });
    if (!settlement) {
      return { payment_id: txn.payment_id, settlement_id: null, bank_ref: null, verdict: "unmatched", issue_type: "missing_settlement" };
    }
    var bankEntry = null, matchMethod = null;
    bankEntry = bankEntries.find(function (b) { return b.bank_ref === settlement.utr; });
    if (bankEntry) matchMethod = "exact_utr";
    if (!bankEntry) {
      var best = null, bestScore = null;
      bankEntries.forEach(function (b) {
        var amtGap = Math.abs(b.credit_amount - settlement.net_amount);
        if (amtGap > AMOUNT_MATCH_TOLERANCE) return;
        var dayGap = Math.abs(daysBetween(b.credit_date, settlement.settlement_date));
        if (dayGap > DATE_MATCH_WINDOW_DAYS) return;
        var score = amtGap + dayGap * 0.01;
        if (best === null || score < bestScore) { best = b; bestScore = score; }
      });
      if (best) { bankEntry = best; matchMethod = "fallback_amount_date"; }
    }
    if (!bankEntry) {
      return { payment_id: txn.payment_id, settlement_id: settlement.settlement_id, bank_ref: null, verdict: "unmatched", issue_type: "missing_settlement" };
    }

    var gross = settlement.gross_amount;
    var expectedTds = round2(gross * TDS_RATE_194O);
    var expectedGst = round2(settlement.mdr_fee * GST_ON_MDR_RATE);
    var vendorId = settlement.vendor_id;
    var expectedCommission = 0;
    if (vendorId && vendorRates[vendorId] !== undefined) expectedCommission = round2(gross * vendorRates[vendorId]);

    var tdsDelta = round2(settlement.tds_amount - expectedTds);
    var gstDelta = round2(settlement.gst_on_mdr - expectedGst);
    var commissionDelta = round2((settlement.vendor_commission || 0) - expectedCommission);

    var textbookExpectedNet = round2(gross - settlement.mdr_fee - expectedGst - expectedTds - expectedCommission);
    var unexplainedDelta = round2(bankEntry.credit_amount - textbookExpectedNet);
    var remaining = round2(unexplainedDelta + tdsDelta + gstDelta + commissionDelta);

    var issueType = "clean", flagged = false;
    if (Math.abs(tdsDelta) > ROUNDING_TOLERANCE) { issueType = "tds_miscalc"; flagged = true; }
    if (Math.abs(gstDelta) > ROUNDING_TOLERANCE) { issueType = issueType === "clean" ? "gst_mdr_miscalc" : "multiple"; flagged = true; }
    if (vendorId && Math.abs(commissionDelta) > ROUNDING_TOLERANCE) { issueType = issueType === "clean" ? "commission_miscalc" : "multiple"; flagged = true; }
    if (Math.abs(remaining) > ROUNDING_TOLERANCE) { issueType = issueType === "clean" ? "amount_mismatch" : "multiple"; flagged = true; }
    if (matchMethod === "fallback_amount_date") { issueType = issueType === "clean" ? "utr_mismatch" : "multiple"; flagged = true; }

    return {
      payment_id: txn.payment_id, settlement_id: settlement.settlement_id, bank_ref: bankEntry.bank_ref,
      verdict: flagged ? "matched_flagged" : "matched_clean", issue_type: issueType,
    };
  }
  function round2(n) { return Math.round(n * 100) / 100; }

  function runLiveRecompute() {
    var totalChecked = 0, totalAgree = 0, mismatches = [];
    TIERS.forEach(function (tierName) {
      var tier = TIER_DATA[tierName];
      var raw = tier.raw;
      raw.transactions.forEach(function (txn) {
        var live = liveReconcile(txn, raw.settlements, raw.bank_statement, tier.vendorRates);
        var stored = tier.agentByPid.agent_output_smart[txn.payment_id];
        totalChecked++;
        var agree = live.verdict === stored.verdict && live.issue_type === stored.issue_type;
        if (agree) totalAgree++; else mismatches.push(txn.payment_id);
      });
    });
    return { totalChecked: totalChecked, totalAgree: totalAgree, mismatches: mismatches };
  }

  // ---------------- Rendering: shell ----------------

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = renderTopbar() + (state.view === "leaderboard" ? renderLeaderboardView() : renderExplorerView()) +
      '<footer class="page-footer">ReconArena · rule-based reference agent vs ground truth · Razorpay AI Buildathon (Open Track)</footer>';
    attachHandlers();
  }

  function renderTopbar() {
    var tabs = TIERS.map(function (t) {
      var active = t === state.tier ? " active" : "";
      return '<button class="tier-btn' + active + '" data-tier="' + t + '">' + t.charAt(0).toUpperCase() + t.slice(1) +
        '<span class="chip">' + passingLabel(TIER_DATA[t], state.agent) + '</span></button>';
    }).join("");
    return (
      '<div class="topbar">' +
        '<div class="brand"><span class="mark">RA</span>' +
          '<div><h1>ReconArena Explorer</h1><div class="tag">agent verdicts vs ground truth, record by record</div></div>' +
        '</div>' +
        '<div class="view-switch">' +
          '<button class="view-btn' + (state.view === "explorer" ? " active" : "") + '" data-view="explorer">Explorer</button>' +
          '<button class="view-btn' + (state.view === "leaderboard" ? " active" : "") + '" data-view="leaderboard">Leaderboard</button>' +
        '</div>' +
        (state.view === "explorer" ? '<div class="tiers">' + tabs + '</div>' : '') +
      '</div>'
    );
  }

  // ---------------- Explorer view ----------------

  function renderExplorerView() {
    return '<div class="layout">' + renderSidebar() + '<div class="main">' + renderScorecards() + renderTable() + '</div></div>';
  }

  function renderSidebar() {
    var issueTypes = ["utr_mismatch", "tds_miscalc", "gst_mdr_miscalc", "missing_settlement", "amount_mismatch", "commission_miscalc"];
    var chips = issueTypes.map(function (it) {
      var active = state.issueChips.has(it) ? " active" : "";
      return '<button class="filter-chip' + active + '" data-issue="' + it + '">' + ISSUE_LABELS[it] + '</button>';
    }).join("");

    var liveStatusHtml = "";
    if (state.liveStatus) {
      var s = state.liveStatus;
      var cls = s.mismatches.length === 0 ? "ok" : "";
      liveStatusHtml = '<div class="live-status ' + cls + '">' +
        (s.mismatches.length === 0
          ? '✓ Recomputed ' + s.totalChecked + ' verdicts live in your browser — all match the stored output.'
          : 'Recomputed live: ' + s.totalAgree + '/' + s.totalChecked + ' verdicts agree with stored output.') +
        '</div>';
    }

    return (
      '<div class="sidebar">' +
        '<div class="side-group">' +
          '<span class="side-label">Agent</span>' +
          '<div class="agent-toggle">' +
            '<button data-agent="agent_output_smart" class="' + (state.agent === "agent_output_smart" ? "active" : "") + '">Smart</button>' +
            '<button data-agent="agent_output_naive" class="' + (state.agent === "agent_output_naive" ? "active" : "") + '">Naive</button>' +
          '</div>' +
        '</div>' +
        '<div class="side-group">' +
          '<span class="side-label">Search</span>' +
          '<div class="search-wrap">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
            '<input class="search-box" id="search-input" type="text" placeholder="payment_id, UTR..." value="' + escapeHtml(state.search) + '">' +
          '</div>' +
        '</div>' +
        '<div class="side-group">' +
          '<span class="side-label">Agent verdict</span>' +
          '<select class="filter-select" id="verdict-select">' +
            '<option value="all"' + (state.verdictFilter === "all" ? " selected" : "") + '>All verdicts</option>' +
            '<option value="matched_clean"' + (state.verdictFilter === "matched_clean" ? " selected" : "") + '>Matched · clean</option>' +
            '<option value="matched_flagged"' + (state.verdictFilter === "matched_flagged" ? " selected" : "") + '>Matched · flagged</option>' +
            '<option value="unmatched"' + (state.verdictFilter === "unmatched" ? " selected" : "") + '>Unmatched</option>' +
          '</select>' +
        '</div>' +
        '<div class="side-group">' +
          '<span class="side-label">Injected issue type</span>' +
          '<div class="chip-list">' + chips + '</div>' +
        '</div>' +
        '<div class="side-group">' +
          '<label class="toggle-row" id="mismatch-toggle"><span>Agent disagrees with truth</span><span class="switch' + (state.mismatchesOnly ? " on" : "") + '"></span></label>' +
        '</div>' +
        '<div class="side-group"><button class="reset-link" id="reset-filters">Reset filters</button></div>' +
        '<button class="live-run-btn" id="live-run-btn">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          'Live Run (recompute in browser)' +
        '</button>' +
        liveStatusHtml +
      '</div>'
    );
  }

  function renderScorecards() {
    var s = tierStats(TIER_DATA[state.tier], state.agent);
    var impact = (DATA.impact && DATA.impact[state.agent === "agent_output_smart" ? "smart" : "naive"]) || null;
    var tierImpact = impact ? impact.per_tier[state.tier] : null;

    function card(label, val, cls) {
      return '<div class="card ' + cls + '"><div class="label">' + label + '</div><div class="value num">' + pct(val) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round((val || 0) * 100) + '%"></div></div></div>';
    }
    var moneyCard = tierImpact ? (
      '<div class="card money ' + (tierImpact.caught_pct >= 0.9 ? "good" : tierImpact.caught_pct >= 0.5 ? "warn" : "bad") + '">' +
        '<div class="label">₹ caught of at-risk</div>' +
        '<div class="value num">' + fmtINR(tierImpact.caught_inr) + ' / ' + fmtINR(tierImpact.at_risk_inr) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round((tierImpact.caught_pct || 0) * 100) + '%"></div></div>' +
      '</div>'
    ) : "";

    return (
      '<div class="scorecards">' +
        card("Overall accuracy", s.overallAccuracy, s.overallAccuracy >= 0.9 ? "good" : s.overallAccuracy >= 0.75 ? "warn" : "bad") +
        card("Matching F1", s.matchF1, "good") +
        card("Issue recall", s.issRec, s.issRec >= 0.9 ? "good" : "warn") +
        card("Attribution accuracy", s.attrAcc, s.attrAcc >= 0.85 ? "good" : "warn") +
        card("False positive rate", s.fpr, s.fpr === 0 ? "good" : "bad") +
        moneyCard +
      '</div>'
    );
  }

  function filteredRows() {
    var tier = TIER_DATA[state.tier];
    var rows = computeRows(tier, state.agent);
    var q = state.search.trim().toLowerCase();
    return rows.filter(function (r) {
      if (q) {
        var hay = (r.txn.payment_id + " " + r.gt.settlement_id + " " + r.gt.bank_ref + " " + (r.agent.bank_ref || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (state.verdictFilter !== "all" && r.agent.verdict !== state.verdictFilter) return false;
      if (state.issueChips.size > 0 && !state.issueChips.has(r.gt.issue_type)) return false;
      if (state.mismatchesOnly && r.correct) return false;
      return true;
    });
  }

  function renderTable() {
    var rows = filteredRows();
    var tier = TIER_DATA[state.tier];
    var total = tier.raw.transactions.length;

    if (rows.length === 0) {
      return '<div class="section-head"><h2>Transactions — ' + AGENT_LABELS[state.agent] + '</h2><span class="result-count">0 of ' + total + '</span></div>' +
        '<div class="table-wrap"><div class="empty-state"><div class="big">🧾</div>No records match these filters.</div></div>';
    }

    var body = rows.map(function (r) {
      var isOpen = state.expanded === r.txn.payment_id;
      var main =
        '<tr class="tx-row' + (isOpen ? " expanded" : "") + '" data-pid="' + r.txn.payment_id + '">' +
          '<td class="mono">' + r.txn.payment_id + '</td>' +
          '<td class="num">' + fmtINR2(r.txn.amount) + '</td>' +
          '<td>' + r.txn.method.toUpperCase() + '</td>' +
          '<td><span class="pill ' + verdictPillClass(r.agent.verdict) + '">' + VERDICT_LABELS[r.agent.verdict] + '</span></td>' +
          '<td>' + ISSUE_LABELS[r.gt.issue_type] + '</td>' +
          '<td class="correctness ' + (r.correct ? "right" : "wrong") + '">' + (r.correct ? "✓" : "✗") + '</td>' +
        '</tr>';
      if (!isOpen) return main;
      return main + '<tr class="detail-row"><td colspan="6">' + renderDetail(r) + '</td></tr>';
    }).join("");

    return (
      '<div class="section-head"><h2>Transactions — ' + AGENT_LABELS[state.agent] + '</h2><span class="result-count">' + rows.length + ' of ' + total + '</span></div>' +
      '<div class="table-wrap"><table class="tx-table">' +
        '<colgroup><col class="c-pid"><col class="c-amount"><col class="c-method"><col class="c-verdict"><col class="c-issue"><col class="c-correct"></colgroup>' +
        '<thead><tr><th>Payment ID</th><th>Amount</th><th>Method</th><th>Agent verdict</th><th>Ground truth issue</th><th>Correct</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table></div>'
    );
  }

  function renderDetail(r) {
    var s = r.settlement, b = r.bank;
    var arrow = '<div class="trail-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>';

    var txnNode = '<div class="trail-node"><h4>Transaction</h4>' +
      kv("order_id", r.txn.order_id) + kv("amount", fmtINR2(r.txn.amount)) + kv("method", r.txn.method) +
      (r.txn.upi_sub_rail ? kv("sub-rail", r.txn.upi_sub_rail) : "") + (r.txn.vendor_id ? kv("vendor", r.txn.vendor_id) : "") +
      kv("status", r.txn.status) + kv("created", r.txn.created_at.slice(0, 10)) + '</div>';

    var settlementNode = s ? '<div class="trail-node"><h4>Settlement</h4>' +
      kv("settlement_id", s.settlement_id) + kv("utr", s.utr) + kv("gross", fmtINR2(s.gross_amount)) +
      kv("mdr_fee", fmtINR2(s.mdr_fee)) + kv("gst_on_mdr", fmtINR2(s.gst_on_mdr)) + kv("tds", fmtINR2(s.tds_amount)) +
      (s.vendor_id ? kv("vendor_commission", fmtINR2(s.vendor_commission)) : "") + kv("net_amount", fmtINR2(s.net_amount)) + '</div>' :
      '<div class="trail-node"><h4>Settlement</h4><div class="kv"><span class="k">— no settlement record —</span></div></div>';

    var bankNode = b ? '<div class="trail-node"><h4>Bank statement</h4>' +
      kv("bank_ref", b.bank_ref) + kv("credit", fmtINR2(b.credit_amount)) + kv("date", b.credit_date) + kv("narration", b.narration) + '</div>' :
      '<div class="trail-node"><h4>Bank statement</h4><div class="kv"><span class="k">— no bank credit found —</span></div></div>';

    return (
      '<div class="detail-panel">' +
        '<div class="trail">' + txnNode + arrow + settlementNode + arrow + bankNode + '</div>' +
        '<div class="verdict-compare">' +
          '<div class="verdict-box gt"><h4>Ground truth expects</h4><p>' + escapeHtml(r.gt.expected_verdict) + '</p></div>' +
          '<div class="verdict-box agent ' + (r.correct ? "right" : "wrong") + '"><h4>' + AGENT_LABELS[state.agent] + ' concluded' + (r.correct ? " ✓" : " ✗") + '</h4><p>' + escapeHtml(r.agent.explanation) + '</p></div>' +
        '</div>' +
      '</div>'
    );
  }

  function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + escapeHtml(v) + '</span></div>'; }

  // ---------------- Leaderboard view ----------------

  function renderLeaderboardView() {
    var board = (DATA.leaderboard && DATA.leaderboard.agents) || [];
    var impact = DATA.impact || {};

    var totalAtRisk = 0, totalCaughtBest = 0;
    board.forEach(function (a) {
      var im = impact[a.id];
      if (im) {
        totalAtRisk = Math.max(totalAtRisk, im.overall.at_risk_inr);
        totalCaughtBest = Math.max(totalCaughtBest, im.overall.caught_inr);
      }
    });

    var hero =
      '<div class="lb-hero">' +
        '<div class="lb-hero-stat"><div class="label">Agents in the arena</div><div class="value">' + board.length + '</div><div class="sub">ranked on the same 3 tiers, same data</div></div>' +
        '<div class="lb-hero-stat"><div class="label">Total ₹ at risk</div><div class="value">' + fmtINR(totalAtRisk) + '</div><div class="sub">across all 3 tiers, all injected issues</div></div>' +
        '<div class="lb-hero-stat"><div class="label">Best agent caught</div><div class="value">' + fmtINR(totalCaughtBest) + '</div><div class="sub">' + (totalAtRisk ? Math.round(totalCaughtBest / totalAtRisk * 100) : 0) + '% of at-risk value</div></div>' +
      '</div>';

    var maxScore = Math.max.apply(null, board.map(function (a) { return a.overall_score || 0; })) || 1;
    var rankCards = board.map(function (a, idx) {
      var tierCells = TIERS.map(function (t) {
        var tr = a.tiers[t];
        var f1 = tr.issue_detection.f1;
        return '<div class="lb-tier-cell"><div class="t-label">' + t + '</div><div class="t-value num">' + pct(f1) + ' issue F1</div></div>';
      }).join("");
      return (
        '<div class="lb-rank-card' + (idx === 0 ? " first" : "") + '">' +
          '<div class="lb-rank-top">' +
            '<div class="lb-medal">' + (idx === 0 ? "🥇" : "#" + a.rank) + '</div>' +
            '<div><div class="lb-name">' + a.name + '</div><div class="lb-desc">' + a.description + '</div></div>' +
            '<div class="lb-score"><div class="num">' + (a.overall_score !== null ? (a.overall_score * 100).toFixed(1) : "—") + '</div><div class="lab">overall score</div></div>' +
          '</div>' +
          '<div class="lb-bar-track"><div class="lb-bar-fill" style="width:' + Math.round((a.overall_score || 0) / maxScore * 100) + '%"></div></div>' +
          '<div class="lb-tier-grid">' + tierCells + '</div>' +
        '</div>'
      );
    }).join("");

    var impactCards = board.map(function (a) {
      var im = impact[a.id];
      if (!im) return "";
      var o = im.overall;
      var caughtPct = Math.round((o.caught_pct || 0) * 100);
      return (
        '<div class="impact-card">' +
          '<h3>' + a.name + ' — ₹ impact</h3>' +
          '<div class="impact-stack"><div class="caught" style="width:' + caughtPct + '%"></div><div class="missed" style="width:' + (100 - caughtPct) + '%"></div></div>' +
          '<div class="impact-legend"><span class="caught-lab">Caught ' + fmtINR(o.caught_inr) + ' (' + caughtPct + '%)</span><span class="missed-lab">Missed ' + fmtINR(o.missed_inr) + '</span></div>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="main">' +
        hero +
        '<div class="section-head"><h2>Ranked agents</h2><span class="result-count">overall score = mean matching F1 + issue-detection F1 across tiers</span></div>' +
        '<div class="lb-rank-list">' + rankCards + '</div>' +
        '<div class="section-head"><h2>Rupee-value impact</h2><span class="result-count">gross value of transactions carrying a real injected issue, across all 3 tiers</span></div>' +
        '<div class="impact-grid">' + impactCards + '</div>' +
      '</div>'
    );
  }

  // ---------------- Event wiring ----------------

  function attachHandlers() {
    document.querySelectorAll(".view-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { state.view = btn.getAttribute("data-view"); render(); });
    });
    document.querySelectorAll(".tier-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { state.tier = btn.getAttribute("data-tier"); state.expanded = null; render(); });
    });
    document.querySelectorAll(".agent-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () { state.agent = btn.getAttribute("data-agent"); state.expanded = null; render(); });
    });

    var searchInput = document.getElementById("search-input");
    if (searchInput) searchInput.addEventListener("input", function () { state.search = searchInput.value; renderMainOnly(); });

    var verdictSelect = document.getElementById("verdict-select");
    if (verdictSelect) verdictSelect.addEventListener("change", function () { state.verdictFilter = verdictSelect.value; renderMainOnly(); });

    document.querySelectorAll(".filter-chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var issue = chip.getAttribute("data-issue");
        if (state.issueChips.has(issue)) state.issueChips.delete(issue); else state.issueChips.add(issue);
        render();
      });
    });

    var mismatchToggle = document.getElementById("mismatch-toggle");
    if (mismatchToggle) mismatchToggle.addEventListener("click", function () { state.mismatchesOnly = !state.mismatchesOnly; render(); });

    var resetBtn = document.getElementById("reset-filters");
    if (resetBtn) resetBtn.addEventListener("click", function () {
      state.search = ""; state.verdictFilter = "all"; state.issueChips = new Set(); state.mismatchesOnly = false; render();
    });

    var liveRunBtn = document.getElementById("live-run-btn");
    if (liveRunBtn) liveRunBtn.addEventListener("click", function () {
      liveRunBtn.disabled = true;
      var originalText = liveRunBtn.innerHTML;
      liveRunBtn.innerHTML = "Recomputing…";
      setTimeout(function () {
        state.liveStatus = runLiveRecompute();
        liveRunBtn.disabled = false;
        render();
      }, 150);
    });

    bindRowClicks();
  }

  function bindRowClicks() {
    document.querySelectorAll(".tx-row").forEach(function (row) {
      row.addEventListener("click", function () {
        var pid = row.getAttribute("data-pid");
        state.expanded = state.expanded === pid ? null : pid;
        render();
      });
    });
  }

  function renderMainOnly() {
    var main = document.querySelector(".main");
    if (!main) return render();
    main.innerHTML = renderScorecards() + renderTable();
    bindRowClicks();
  }

  render();
})();
</script>
</body>
</html>
